name: Atualizar Projetos no README

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar projetos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const username = "Jean-Oliveira-Lara";

            const response = await github.rest.repos.listForUser({
              username: username,
              type: "owner",
              sort: "updated",
              direction: "desc",
              per_page: 100
            });

            const repos = response.data
              .filter(repo => !repo.fork)
              .filter(repo => !repo.archived)
              .filter(repo => !repo.private)
              .filter(repo => repo.name !== username);

            let projects = "";

            for (const repo of repos) {
              projects += `### [${repo.name}](https://github.com/${username}/${repo.name})

${repo.description || "Projeto sem descrição."}

**Tecnologia:** ${repo.language || "Não especificada"}  
**⭐ Stars:** ${repo.stargazers_count}

[Ver projeto](https://github.com/${username}/${repo.name})

`;
            }

            if (!projects) {
              projects = "Nenhum projeto público encontrado.";
            }

            const readmePath = "README.md";

            if (!fs.existsSync(readmePath)) {
              core.setFailed("README.md não encontrado.");
              return;
            }

            let readme = fs.readFileSync(readmePath, "utf8");

            const startMarker = "<!-- PROJECTS:START -->";
            const endMarker = "<!-- PROJECTS:END -->";

            const start = readme.indexOf(startMarker);
            const end = readme.indexOf(endMarker);

            if (start === -1 || end === -1) {
              core.setFailed("Marcadores dos projetos não encontrados no README.");
              return;
            }

            const before = readme.substring(
              0,
              start + startMarker.length
            );

            const after = readme.substring(end);

            const updatedReadme =
              before +
              "\n\n" +
              projects +
              "\n" +
              after;

            fs.writeFileSync(readmePath, updatedReadme);

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualiza projetos no README"
            git push
          fi
