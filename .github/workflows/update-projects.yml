name: Atualizar Projetos no README

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Atualizar projetos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const username = "Jean-Oliveira-Lara";

              // Busca todos os repositórios do usuário (paginação automática)
              const repos = await github.paginate(github.rest.repos.listForUser, {
                username,
                type: 'owner',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              });

              const filtered = repos
                .filter(repo => !repo.fork && !repo.archived && !repo.private && repo.name !== username);

              let projects = filtered.map(repo => `### [${repo.name}](https://github.com/${username}/${repo.name})

${repo.description || "Projeto sem descrição."}

**Tecnologia:** ${repo.language || "Não especificada"}  
**⭐ Stars:** ${repo.stargazers_count}

[Ver projeto](https://github.com/${username}/${repo.name})

`).join('\n');

              if (!projects) {
                projects = "Nenhum projeto público encontrado.";
              }

              const readmePath = "README.md";

              if (!fs.existsSync(readmePath)) {
                throw new Error("README.md não encontrado.");
              }

              let readme = fs.readFileSync(readmePath, "utf8");

              const startMarker = "<!-- PROJECTS:START -->";
              const endMarker = "<!-- PROJECTS:END -->";

              const start = readme.indexOf(startMarker);
              const end = readme.indexOf(endMarker, start + startMarker.length);

              if (start === -1 || end === -1) {
                throw new Error("Marcadores dos projetos não encontrados no README.");
              }

              const before = readme.substring(0, start + startMarker.length);
              const after = readme.substring(end); // mantém o endMarker em after

              const updatedReadme = before + "\n\n" + projects + "\n" + after;

              if (updatedReadme === readme) {
                console.log("README já está atualizado. Nada a fazer.");
                return;
              }

              fs.writeFileSync(readmePath, updatedReadme);
              console.log("README atualizado com sucesso.");
            } catch (error) {
              console.error(error);
              throw error;
            }

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualiza projetos no README"
            git push
          fi
