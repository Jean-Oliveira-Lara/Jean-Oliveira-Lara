name: Atualizar Projetos no README

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: List workspace (debug)
        run: |
          echo "== Workspace files =="
          ls -la
          echo "\n== README head (first 200 lines) =="
          if [ -f README.md ]; then sed -n '1,200p' README.md; else echo "README.md not found"; fi

      - name: Atualizar projetos (debug + seguro)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            (async () => {
              try {
                const username = process.env.GITHUB_REPOSITORY
                  ? process.env.GITHUB_REPOSITORY.split('/')[0]
                  : "Jean-Oliveira-Lara";
                console.log("username:", username);

                const repos = await github.paginate(github.rest.repos.listForUser, {
                  username,
                  type: 'owner',
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 100
                });

                console.log("total repos fetched:", repos.length);

                const filtered = repos
                  .filter(r => !r.fork && !r.archived && !r.private && r.name !== username);

                console.log("repos after filter:", filtered.length);

                let projects = filtered.map(repo => `### [${repo.name}](https://github.com/${username}/${repo.name})

${repo.description || 'Projeto sem descrição.'}

**Tecnologia:** ${repo.language || 'Não especificada'}  
**⭐ Stars:** ${repo.stargazers_count}

[Ver projeto](https://github.com/${username}/${repo.name})

`).join('\n');

                if (!projects) {
                  projects = "Nenhum projeto público encontrado.";
                }

                const readmePath = "README.md";

                if (!fs.existsSync(readmePath)) {
                  console.error("README.md não encontrado no workspace. Arquivos no workspace:");
                  console.log(fs.readdirSync('.'));
                  return;
                }

                let readme = fs.readFileSync(readmePath, "utf8");

                const startMarker = "<!-- PROJECTS:START -->";
                const endMarker = "<!-- PROJECTS:END -->";

                if (!readme.includes(startMarker) || !readme.includes(endMarker)) {
                  console.error("Marcadores dos projetos não encontrados no README.");
                  console.log("Trecho inicial do README (até 2000 chars):");
                  console.log(readme.slice(0, 2000));
                  return;
                }

                // Substituição segura entre marcadores (preserva os marcadores)
                function escapeForRegex(s) {
                  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                }

                const escapedStart = escapeForRegex(startMarker);
                const escapedEnd = escapeForRegex(endMarker);
                const regex = new RegExp(`${escapedStart}[\\s\\S]*?${escapedEnd}`, 'm');

                const replacementContent = `${startMarker}\n\n${projects}\n${endMarker}`;

                // Use função de replacement para evitar interpretação de $ na string
                const updatedReadme = readme.replace(regex, () => replacementContent);

                if (updatedReadme === readme) {
                  console.log("README já está atualizado. Nada a fazer.");
                  return;
                }

                fs.writeFileSync(readmePath, updatedReadme);
                console.log("README atualizado com sucesso.");
              } catch (error) {
                console.error(error);
                throw error;
              }
            })();

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Melhora substituição segura no README (escape de marcadores e replacement seguro)"
            git push
          fi
